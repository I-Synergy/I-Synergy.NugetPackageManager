# Quality gate: every check that must pass before a commit is pushed.
# The same steps run locally with `npm run quality` (tools/quality-gate.mjs).
# SonarCloud analysis is performed by its GitHub integration (automatic analysis);
# no scanner or SONAR_TOKEN is required here.
name: Quality Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run esbuild

      - name: Lint (ESLint + SonarJS)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests with coverage
        run: xvfb-run -a npm run test:coverage

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
