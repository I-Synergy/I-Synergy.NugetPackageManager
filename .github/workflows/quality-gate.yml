# Quality gate: every check that must pass before a commit is pushed.
# The same steps run locally with `npm run quality` (tools/quality-gate.mjs).
name: Quality Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, tests and SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Read at job level so the scan step can test it with `env.SONAR_TOKEN`;
      # the `secrets` context is not available in step-level `if` expressions.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run esbuild

      - name: Lint (ESLint + SonarJS)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests with coverage
        run: xvfb-run -a npm run test:coverage

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Cloud not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not set — skipping the SonarCloud scan. Add the repository secret to enable the server-side quality gate."
