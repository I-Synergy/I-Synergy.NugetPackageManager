# SonarQube Cloud configuration for NuGet Package Manager.
# The scan runs in .github/workflows/quality-gate.yml and waits for the gate result,
# so a failing quality gate fails the workflow.
sonar.projectKey=I-Synergy_NugetPackageManager
sonar.organization=i-synergy
sonar.projectName=NuGet Package Manager for Visual Studio Code
sonar.sourceEncoding=UTF-8

# The extension is a dual-process TypeScript project: both host and webview live in src/.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=dist/**,out/**,node_modules/**,releases/**,docs/**,.ai/**,.vscode-test/**,src/**/__fixtures__/**
sonar.coverage.exclusions=src/**/*.test.ts,src/**/__fixtures__/**

# Produced by `npm run test:coverage` (c8) and consumed unchanged by the scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Fail the scan (and therefore CI) when the server-side quality gate fails.
sonar.qualitygate.wait=true
