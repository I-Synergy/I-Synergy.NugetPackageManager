<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NuGet Package Manager for VS Code — social preview</title>
<style>
  html, body {
    margin: 0;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #ffffff;
    background:
      radial-gradient(900px 600px at 88% 6%, rgba(0, 72, 128, 0.55), transparent 62%),
      radial-gradient(720px 520px at 8% 100%, rgba(0, 72, 128, 0.32), transparent 66%),
      #16161f;
  }
  .bar {
    position: absolute;
    inset: 0 0 auto 0;
    height: 8px;
    background: linear-gradient(90deg, #004880, #0a76c4 55%, #66b3e8);
  }
  .wrap {
    display: flex;
    align-items: center;
    gap: 52px;
    height: 100%;
    padding: 0 84px;
    box-sizing: border-box;
  }
  .logo {
    flex: 0 0 auto;
    width: 260px;
    height: 260px;
    border-radius: 52px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 34px 90px rgba(0, 0, 0, 0.48);
  }
  .logo svg {
    width: 196px;
    height: 196px;
    color: #004880;
  }
  h1 {
    margin: 0;
    font-size: 56px;
    line-height: 1.06;
    letter-spacing: -1.2px;
    font-weight: 700;
  }
  .for {
    margin: 6px 0 20px;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: #8fc3ea;
  }
  p {
    margin: 0;
    max-width: 720px;
    font-size: 25px;
    line-height: 1.45;
    color: #c7c9d6;
  }
  .tags {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tag {
    padding: 8px 16px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    color: #dfe2ee;
    font-size: 18px;
  }
</style>
</head>

</html>
