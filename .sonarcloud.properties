# SonarCloud Automatic Analysis configuration (GitHub integration).
# Automatic analysis does not read sonar-project.properties; it reads this file.
# The AI skill templates and documentation mockups are not product code and are
# excluded so the quality gate measures the extension itself.
sonar.sources=.
sonar.exclusions=.ai/**,docs/**,dist/**,out/**,node_modules/**,releases/**,coverage/**,.vscode-test/**,src/**/__fixtures__/**
sonar.cpd.exclusions=.ai/**,docs/**

sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.coverage.exclusions=src/**/*.test.ts,src/**/__fixtures__/**
